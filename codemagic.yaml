workflows:
  android-debug-apk:
    name: ArenaNative Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Install Gradle
        script: |
          brew install gradle
      - name: Build debug APK
        script: |
          gradle --version
          gradle --no-daemon assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
